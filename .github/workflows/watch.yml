name: GitHub Bulk Watch

on:
  workflow_dispatch:
    inputs:
      action:
        description: "watch mi unwatch mi?"
        type: choice
        options: [watch, unwatch]
        default: watch
      dry_run:
        description: "Gerçekten watch/unwatch atma, sadece simüle et"
        type: boolean
        default: false
      reset_state:
        description: "Eski (cache'lenmiş) state'i temizle, sıfırdan tara"
        type: boolean
        default: false
      max_workers:
        description: "Kaç paralel işçi (hız <-> güvenlik dengesi)"
        type: number
        default: 8
      stagger_seconds:
        description: "İlk işçi grubunu ayrık atma aralığı (patlamayı önler)"
        type: number
        default: 0.35
      batch_size:
        description: "Kaçarlı gruplar halinde işlensin (grup sonunda ara kayıt yapılır)"
        type: number
        default: 300
      rate_limit_wait_cap:
        description: "Rate limit'e takılınca en fazla kaç saniye beklenecek"
        type: number
        default: 150
      rate_limit_rescue_rounds:
        description: "Sadece rate limit yüzünden başarısız olanlar kaç tur daha denensin"
        type: number
        default: 5

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # ^ Actions'ın ücretsiz plan üst sınırı ~360 dk. TOP_N çok yüksekse
    #   bir çalıştırmada bitmeyebilir; state cache sayesinde bir sonraki
    #   çalıştırma kaldığı yerden devam eder.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests

      # EKLENDI: state dosyasını çalıştırmalar arasında kalıcı tutar
      - name: State dosyasını cache'ten geri yükle
        uses: actions/cache@v4
        with:
          path: github_watch_state.json
          key: github-watch-state-${{ github.run_id }}
          restore-keys: |
            github-watch-state-

      - name: Scripti çalıştır
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          RESET_STATE: ${{ inputs.reset_state && '1' || '0' }}
          MAX_WORKERS: ${{ inputs.max_workers }}
          STAGGER_SECONDS: ${{ inputs.stagger_seconds }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          RATE_LIMIT_WAIT_CAP: ${{ inputs.rate_limit_wait_cap }}
          RATE_LIMIT_RESCUE_ROUNDS: ${{ inputs.rate_limit_rescue_rounds }}
          # NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # istersen aç, telefonuna push bildirim gider
        run: python github_bulk_watch.py

      # EKLENDI: rapor ve state dosyasını indirilebilir artifact yap
      - name: Rapor ve state'i artifact olarak yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-watch-output
          path: |
            github_watch_report.csv
            github_watch_state.json
            github_watch.log
